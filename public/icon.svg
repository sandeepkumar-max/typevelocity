<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradients for the dynamic 'T' and keyboard -->
    <linearGradient id="tv-top-bar" x1="120" y1="110" x2="410" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="45%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <linearGradient id="tv-stem-main" x1="190" y1="160" x2="260" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0075FF" />
      <stop offset="60%" stop-color="#0055EE" />
      <stop offset="100%" stop-color="#003ECC" />
    </linearGradient>

    <linearGradient id="tv-stem-ribbon" x1="280" y1="140" x2="210" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0099FF" />
      <stop offset="85%" stop-color="#0062E0" />
      <stop offset="100%" stop-color="#0045B5" />
    </linearGradient>

    <linearGradient id="tv-stem-back" x1="260" y1="160" x2="380" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0060E6" />
      <stop offset="100%" stop-color="#0035A8" />
    </linearGradient>

    <linearGradient id="tv-orbit" x1="90" y1="360" x2="430" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D5FF" />
      <stop offset="40%" stop-color="#0088FF" />
      <stop offset="85%" stop-color="#0055FF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>

    <linearGradient id="tv-key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00AAFF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <filter id="tv-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0077FF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Orbital swoosh ring -->
  <path
    d="M 330 230 
       C 390 245 425 285 420 330 
       C 413 378 350 415 260 422 
       C 170 428 100 398 90 355 
       C 84 328 105 300 145 280 
       C 135 292 128 308 128 322 
       C 128 360 180 395 255 395 
       C 335 395 392 355 395 320 
       C 398 290 370 262 330 248
       Z"
    fill="url(#tv-orbit)"
  />

  <!-- Keyboard base keycaps (Row 1 - back row) -->
  <g fill="url(#tv-key)">
    <rect x="150" y="296" width="22" height="18" rx="4.5" />
    <rect x="180" y="296" width="22" height="18" rx="4.5" />
    <!-- gap for stem -->
    <rect x="280" y="296" width="22" height="18" rx="4.5" />
    <rect x="310" y="296" width="22" height="18" rx="4.5" />
    <rect x="340" y="296" width="22" height="18" rx="4.5" />

    <!-- Keyboard base keycaps (Row 2 - middle row) -->
    <rect x="136" y="322" width="24" height="20" rx="5" />
    <rect x="168" y="322" width="24" height="20" rx="5" />
    <!-- gap for stem -->
    <rect x="270" y="322" width="24" height="20" rx="5" />
    <rect x="302" y="322" width="24" height="20" rx="5" />
    <rect x="334" y="322" width="24" height="20" rx="5" />

    <!-- Spacebar (Row 3 - bottom row) -->
    <rect x="160" y="352" width="180" height="24" rx="7" />
  </g>

  <!-- Stylized Dynamic 3D "T" -->
  <g filter="url(#tv-glow)">
    <!-- Back wing / Right overhang of the T -->
    <path
      d="M 285 170 
         C 320 170 380 162 400 148 
         C 408 142 410 132 402 122 
         C 395 114 380 110 360 110 
         L 280 110
         Z"
      fill="url(#tv-stem-back)"
    />

    <!-- Main top bar of the T -->
    <path
      d="M 165 110 
         C 145 110 130 120 125 138 
         L 115 170 
         C 125 172 170 172 225 172 
         L 255 110 
         Z"
      fill="url(#tv-top-bar)"
    />

    <!-- Right top bar extension -->
    <path
      d="M 250 110 
         L 370 110 
         C 395 110 412 118 410 134 
         C 408 148 385 165 340 170 
         L 285 170 
         Z"
      fill="url(#tv-top-bar)"
    />

    <!-- Main dynamic stem and ribbon curve -->
    <!-- Left body of stem -->
    <path
      d="M 218 172 
         L 192 290 
         C 190 305 198 322 210 338 
         C 218 348 226 350 230 350 
         C 234 350 236 342 238 330 
         L 262 172 
         Z"
      fill="url(#tv-stem-main)"
    />

    <!-- Glossy 3D swooping ribbon front facet -->
    <path
      d="M 258 125 
         C 258 125 310 145 315 168 
         C 320 190 288 238 266 288 
         C 252 320 238 344 230 350 
         C 228 348 222 340 220 330 
         C 235 285 270 205 262 168 
         C 258 148 245 136 235 130 
         Z"
      fill="url(#tv-stem-ribbon)"
    />
  </g>
</svg>
